[workspace]
resolver = "2"
members = [
    "crates/graphnight-core",
    "crates/graphnight-sql",
    "crates/graphnight-storage",
    "crates/graphnight-graphql",
    "crates/graphnight-python",
    "crates/graphnight-server",
    "crates/graphnight-cli",
    "tests/e2e",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["GraphNight Team"]
repository = "https://github.com/niranjanaryan/graphnight"

[workspace.dependencies]
# Core data processing - use custom SQL generator, avoid datafusion/parquet issues
# datafusion = { version = "55", features = ["sql"] }
arrow = { version = "55", features = [] }
zstd-safe = "7.2.0"
tantivy = "0.26"
futures = "0.3"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async
tokio = { version = "1.38", features = ["full", "tracing"] }
async-trait = "0.1.76"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14"
toml = { version = "0.8" }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GraphQL + HTTP
async-graphql = { version = "7.0", features = ["chrono"] }
async-graphql-axum = "7.0"
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

# Database drivers
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "derive",
] }
postgres = { version = "0.11", features = ["with-chrono-0_4"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4", "v7"] }
regex = "1.10"
lru = "0.12"
dashmap = "5.5"
parking_lot = "0.12"

# Streaming helpers
async-stream = "0.3"

# Testing
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", default-features = false }
pretty_assertions = "1.4"
tempfile = "3.10"
criterion = "0.5"
# proptest = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
