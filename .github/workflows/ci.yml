name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-engine

      - name: Format
        run: cargo fmt --all -- --check

      # Warnings allowed for alpha; tighten to -Dwarnings before production.
      - name: Clippy
        run: cargo clippy --workspace --exclude graphnight-python --all-targets

      - name: Test
        run: cargo test --workspace --exclude graphnight-python

  smoke:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-engine

      - name: Build CLI and server
        run: cargo build -p graphnight-cli -p graphnight-server
