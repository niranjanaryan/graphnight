name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --exclude graphnight-python -- -D warnings
      - name: Check Python bindings compile
        run: cargo check -p graphnight-python
      - name: Check Node bindings compile
        run: cargo check -p graphnight-node

  schema-sdl:
    name: Schema SDL snapshot is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # The Node client validates its GraphQL documents against this snapshot.
      # Regenerate and commit when the schema changes:
      #   GRAPHNIGHT_WRITE_SDL=1 cargo test -p graphnight-graphql
      - name: Regenerate SDL snapshot
        run: GRAPHNIGHT_WRITE_SDL=1 cargo test -p graphnight-graphql test_export_sdl
      - name: Fail if snapshot is stale
        run: |
          if ! git diff --quiet -- node-client/tests/schema.graphql; then
            echo "::error::node-client/tests/schema.graphql is stale. Regenerate with:"
            echo "::error::  GRAPHNIGHT_WRITE_SDL=1 cargo test -p graphnight-graphql"
            git diff -- node-client/tests/schema.graphql
            exit 1
          fi

  node-client:
    name: Node client (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node-client/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx jest
      - name: Lint
        run: npx eslint 'src/**/*.ts'

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphnight_test
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: graphnight_test
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
        ports: 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace --exclude graphnight-python
        env:
          GRAPHNIGHT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/graphnight_test
          GRAPHNIGHT_TEST_MYSQL_URL: mysql://mysql:mysql@localhost/graphnight_test
          GRAPHNIGHT_SKIP_TESTCONTAINERS: "1"

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace --exclude graphnight-python

  build-binary:
    name: Build binary
    runs-on: ubuntu-latest
    needs: [test, test-macos]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build server binary
        run: cargo build --release -p graphnight-server

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit
        continue-on-error: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked
      - name: Generate SBOM
        run: cargo sbom > sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v8
        with:
          name: sbom
          path: sbom.spdx.json