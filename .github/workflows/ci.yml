name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Warnings allowed for alpha; tighten to -Dwarnings before production.
      - name: Clippy
        run: cargo clippy --workspace --exclude graphnight-python --all-targets

      - name: Test
        run: cargo test --workspace --exclude graphnight-python

      # Explicit e2e crate: SQLite pipeline always; Postgres/MySQL via testcontainers
      # when Docker is available (ubuntu-latest has Docker). Soft-skip locally with
      # GRAPHNIGHT_SKIP_TESTCONTAINERS=1 or when the daemon is down.
      - name: E2E (SQLite + Postgres/MySQL testcontainers)
        run: cargo test -p graphnight-e2e -- --nocapture

  smoke:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI and server
        run: cargo build -p graphnight-cli -p graphnight-server

      - name: Example dry-run
        run: |
          ./target/debug/graphnight \
            --storage-path examples/data \
            query dry-run --file examples/query.json

  security:
    name: SBOM / vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Advisory DB noise should not fail the whole pipeline; review the job log.
      - name: cargo audit
        continue-on-error: true
        run: cargo audit

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: graphnight-sbom
          output-file: graphnight.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphnight-sbom
          path: graphnight.spdx.json

  # Optional / manual: PyO3 bindings need maturin + Python 3.11+.
  # Not run on every PR (disk/time). Documented in crates/graphnight-python/README.md.
