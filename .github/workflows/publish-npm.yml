name: Publish Node.js SDKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-native:
    name: Build @graphnight/native (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install napi CLI
        working-directory: crates/graphnight-node
        run: npm install -g @napi-rs/cli
      - name: Build native binary
        working-directory: crates/graphnight-node
        run: napi build --platform --release --target ${{ matrix.target }}
      - name: Upload native binary
        uses: actions/upload-artifact@v8
        with:
          name: native-${{ matrix.target }}
          path: crates/graphnight-node/graphnight.*.node
          retention-days: 1

  publish-native:
    name: Publish @graphnight/native
    needs: [build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download all native binaries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: node-native/
          merge-multiple: true
      - name: List binaries
        working-directory: node-native
        run: ls -lah *.node 2>/dev/null || echo "no .node files"
      - name: Publish
        working-directory: node-native
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-client:
    name: Publish @graphnight/client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        working-directory: node-client
        run: npm ci
      - name: Build
        working-directory: node-client
        run: npm run build
      - name: Publish
        working-directory: node-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}