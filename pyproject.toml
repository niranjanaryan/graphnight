# Root Python packaging is intentionally not published.
# Experimental PyO3 bindings live in rust-engine/graphnight-python/.
# This file exists only so tooling that looks for a root pyproject does not
# assume a FastAPI app. Prefer the Rust CLI/server for the OSS alpha.

[project]
name = "graphnight-workspace"
version = "0.1.0"
description = "GraphNight workspace marker (not a publishable package)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
