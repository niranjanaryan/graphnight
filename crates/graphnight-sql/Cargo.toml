[package]
name = "graphnight-sql"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
graphnight-core = { path = "../graphnight-core" }
sqlx = { workspace = true }
# Embedded analytical engine, opt-in. `bundled` compiles DuckDB from source and
# is heavy (a large C++ amalgamation); the feature exists so a consumer that does
# not need DuckDB does not pay for it, while the server and CLI enable it.
duckdb = { version = "1", default-features = false, features = [
    "bundled",
    "chrono",
    "serde_json",
    "rust_decimal",
], optional = true }
rust_decimal = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
zstd-safe = { workspace = true }
futures = { workspace = true }
pin-project-lite = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
async-stream = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tracing-subscriber = { workspace = true }
pretty_assertions = { workspace = true }
graphnight-storage = { path = "../graphnight-storage" }
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "sql_generate"
harness = false

[[bench]]
name = "policy_enforce"
harness = false

[features]
default = []
# Execute queries against DuckDB. Off by default because `bundled` pulls a large
# C++ build into every consumer; enabled by the server and CLI binaries.
duckdb = ["dep:duckdb"]