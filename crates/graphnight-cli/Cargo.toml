[package]
name = "graphnight-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[[bin]]
name = "graphnight"
path = "src/main.rs"

[dependencies]
graphnight-core = { path = "../graphnight-core" }
graphnight-sql = { path = "../graphnight-sql", features = ["duckdb"] }
graphnight-storage = { path = "../graphnight-storage" }
graphnight-runtime = { path = "../graphnight-runtime" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tabled = "0.16"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
graphnight-telemetry = { workspace = true }