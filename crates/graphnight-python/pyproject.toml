[build-system]
requires = ["setuptools>=68.0", "maturin>=1.0"]
build-backend = "maturin"

[project]
name = "graphnight"
version = "0.1.0"
description = "High-performance semantic layer for AI agents and humans"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "GraphNight Team"}]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py38", "pyo3/generate-abi3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true