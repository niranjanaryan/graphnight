[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "graphnight"
version = "1.0.0"
description = "Embeddable semantic layer for AI agents and humans (Rust-backed Python bindings)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "GraphNight Team", email = "nirunitk@gmail.com" }]
requires-python = ">=3.11"
keywords = ["semantic-layer", "graphql", "sql", "analytics", "rust"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/niranjanaryan/graphnight"
Repository = "https://github.com/niranjanaryan/graphnight"
Changelog = "https://github.com/niranjanaryan/graphnight/blob/main/CHANGELOG.md"
Documentation = "https://github.com/niranjanaryan/graphnight/tree/main/docs"
Issues = "https://github.com/niranjanaryan/graphnight/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.maturin]
module-name = "graphnight"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"

[tool.ruff]
line-length = 100
target-version = "py311"
