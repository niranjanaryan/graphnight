[server]
host = "127.0.0.1"
port = 8080

[storage]
type = "yaml"
path = "./examples/data"
# HA metadata (shared across replicas): type = "postgres"
# path = "env:GRAPHNIGHT_METADATA_DATABASE_URL"
# or path = "postgresql://graphnight:graphnight@127.0.0.1:5433/graphnight_meta"
# See examples/graphnight.postgres.toml and docker compose --profile ha

# Example datasource — replace with your own credentials.
# Prefer secret refs: connection_string = "env:GRAPHNIGHT_DATASOURCE_DEMO"
# (set GRAPHNIGHT_REQUIRE_SECRET_REFS=1 to require env: refs on GraphQL writes).
# WARNING: Alpha builds expose GraphQL with no authentication unless API keys are set.
# Do not point this at production databases.
[datasources.demo]
driver = "sqlite"
connection_string = "sqlite:./examples/data/demo.db"
description = "Local demo SQLite database"
pool_size = 1
